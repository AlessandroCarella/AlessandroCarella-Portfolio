<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Alessandro Carella — Data Scientist</title>
        <meta name="description" content="Portfolio of a data scientist specializing in data visualization and explainable AI. 19 projects spanning ML, XAI, and visual analytics." />
        <!-- canonical emitted per-route by <Seo>/react-helmet-async (avoids Google's multiple-canonical-ignored rule) -->
        <meta name="theme-color" content="#010409" />

        <!-- Icons (PNGs generated from propic.jpeg via scripts/gen-icons.mjs) -->
        <link rel="icon" href="/icon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- Resource hints — preload the self-hosted hero font (LCP) -->
        <link rel="preload" href="/fonts/RobotoFlex.woff2" as="font" type="font/woff2" crossorigin />

        <!-- Open Graph (og-image.png generated 1200x630 by scripts/gen-og-image.mjs) -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:site_name" content="Alessandro Carella" />
        <meta property="og:title" content="Alessandro Carella — Data Scientist" />
        <meta property="og:description" content="Portfolio of a data scientist specializing in data visualization and explainable AI. 19 projects spanning ML, XAI, and visual analytics." />
        <meta property="og:url" content="%SITE_URL%/home" />
        <meta property="og:image" content="%SITE_URL%/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Alessandro Carella — Data Scientist" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Alessandro Carella — Data Scientist" />
        <meta name="twitter:description" content="Portfolio of a data scientist specializing in data visualization and explainable AI." />
        <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

        <!-- Structured data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "ProfilePage",
              "@id": "%SITE_URL%/#profilepage",
              "url": "%SITE_URL%/home",
              "mainEntity": { "@id": "%SITE_URL%/#person" }
            },
            {
              "@type": "Person",
              "@id": "%SITE_URL%/#person",
              "name": "Alessandro Carella",
              "jobTitle": "Data Scientist",
              "url": "%SITE_URL%/home",
              "description": "Data scientist specializing in data visualization and explainable AI.",
              "image": "%SITE_URL%/propic.jpeg",
              "email": "mailto:alessandro.carella.lavoro@gmail.com",
              "nationality": "Italian",
              "knowsLanguage": ["en", "it"],
              "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Pisa" },
              "knowsAbout": ["Data Science","Data Visualization","Explainable AI","Machine Learning","Visual Analytics","Python","React"],
              "sameAs": [
                "https://github.com/AlessandroCarella",
                "https://www.linkedin.com/in/alessandrocarella"
              ]
            },
            {
              "@type": "WebSite",
              "@id": "%SITE_URL%/#website",
              "url": "%SITE_URL%/",
              "name": "Alessandro Carella — Portfolio",
              "about": { "@id": "%SITE_URL%/#person" }
            }
          ]
        }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
